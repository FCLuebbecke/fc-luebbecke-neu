<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Platzhalter Darts">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a626"/>
      <stop offset="1" stop-color="#0a6e12"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="url(#gd)"/>
  <!-- Dartscheibe -->
  <g transform="translate(450 310)">
    <circle r="150" fill="#0a5012"/>
    <circle r="150" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle r="110" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <circle r="70"  fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <circle r="30"  fill="#e7f3e8"/>
    <circle r="12"  fill="#16a626"/>
    <g stroke="#ffffff" stroke-width="3" opacity="0.5">
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="-150" x2="0" y2="150"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/>
      <line x1="-106" y1="106" x2="106" y2="-106"/>
    </g>
  </g>
  <text x="450" y="560" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="36" font-weight="600" fill="#fff" letter-spacing="3">DARTS · FOTO FOLGT</text>
</svg>
